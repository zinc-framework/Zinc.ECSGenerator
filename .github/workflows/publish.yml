name: Publish to NuGet

# Publishes Zinc.ECSGenerator to nuget.org when a version tag is pushed.
#   git tag v1.3.3 && git push origin v1.3.3
# The package version is taken from the tag (leading "v" stripped), so the tag is
# the source of truth — the <Version> in the .csproj is only a local-dev default.
#
# Authenticates with nuget.org Trusted Publishing, so there's no stored API key: the
# job's GitHub OIDC token is exchanged for a one-hour key. nuget.org only issues it
# when the package owner has a trusted publishing policy matching this repository,
# this workflow file (publish.yml) and the "production" environment.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # lets the job request the OIDC token that NuGet/login exchanges

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production # must match the policy's Environment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack Zinc.ECSGenerator/Zinc.ECSGenerator.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.value }}
          -p:GeneratePackageOnBuild=false
          --output ${{ runner.temp }}/pkg

      # After packing: the key expires an hour after it's issued.
      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: afterschool # the nuget.org account that owns the package and the policy

      - name: Push to NuGet
        run: >
          dotnet nuget push "${{ runner.temp }}/pkg/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
